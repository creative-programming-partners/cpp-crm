# Publica el CRM en Vercel cada vez que se sube un cambio a la rama main.
# Necesita el secreto VERCEL_TOKEN en el repositorio (Settings → Secrets and variables → Actions).
name: Publicar en Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-produccion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_cfW6mMb1ckzQJ2NjrSZy8R8z
      VERCEL_PROJECT_ID: prj_HsGrJiK4KJ4v5aGrkPvAJxzNQ2rC
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Falta la clave de Vercel
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::warning::No se publicó: falta el secreto VERCEL_TOKEN en este repositorio."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22

      - name: Publicar en producción
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@65.9.0 deploy --prod --yes --token="$VERCEL_TOKEN"
