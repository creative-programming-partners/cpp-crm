<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050f17">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>CRM CPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — fixed sidebar of views, working area of tables/boards, detail drawer slides in from the right. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --surface-2:#f0f3f5; --surface-3:#e6ebee;
  --line:#dde3e6; --line-hi:#c6d0d5;
  --text:#071521; --text-2:#3e545f; --text-3:#5f737c;
  --accent:#1d5ae0; --accent-hi:#123fa8; --accent-soft:#e7eefc; --on-accent:#ffffff;
  --ok:#0d7a63; --ok-soft:#e1f2ec; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b42318; --bad-soft:#fbe9e7;
  --st-nuevo:#607985; --st-contactado:#1d5ae0; --st-respondio:#6d4fd8; --st-interesado:#a35f00;
  --st-propuesta:#0a7891; --st-ganado:#0d7a63; --st-perdido:#b42318; --st-descartado:#7d8f97;
  --shadow:0 1px 2px rgba(7,21,33,.06),0 10px 30px rgba(7,21,33,.10);
  --scrim:rgba(7,21,33,.42);
  --f-sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050f17; --surface:#0b1a26; --surface-2:#0f2130; --surface-3:#16293a;
    --line:#1a2d3b; --line-hi:#2a4253;
    --text:#f4f7f5; --text-2:#a6b8c1; --text-3:#7b919c;
    --accent:#5b8cff; --accent-hi:#82a8ff; --accent-soft:#132a4d; --on-accent:#04101c;
    --ok:#72f2d2; --ok-soft:#0c2d29; --warn:#ffb648; --warn-soft:#33240b; --bad:#ff9a8b; --bad-soft:#3a1714;
    --st-nuevo:#9aafb9; --st-contactado:#6f9aff; --st-respondio:#ab9bff; --st-interesado:#ffb648;
    --st-propuesta:#5fd0e8; --st-ganado:#72f2d2; --st-perdido:#ff8a7a; --st-descartado:#6f8691;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050f17; --surface:#0b1a26; --surface-2:#0f2130; --surface-3:#16293a;
  --line:#1a2d3b; --line-hi:#2a4253;
  --text:#f4f7f5; --text-2:#a6b8c1; --text-3:#7b919c;
  --accent:#5b8cff; --accent-hi:#82a8ff; --accent-soft:#132a4d; --on-accent:#04101c;
  --ok:#72f2d2; --ok-soft:#0c2d29; --warn:#ffb648; --warn-soft:#33240b; --bad:#ff9a8b; --bad-soft:#3a1714;
  --st-nuevo:#9aafb9; --st-contactado:#6f9aff; --st-respondio:#ab9bff; --st-interesado:#ffb648;
  --st-propuesta:#5fd0e8; --st-ganado:#72f2d2; --st-perdido:#ff8a7a; --st-descartado:#6f8691;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.ph-num{white-space:nowrap}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{flex:none;display:block}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:-.04em}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--text-3);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--text-2);cursor:pointer;text-align:left;font-weight:500}
.nav-i:hover{background:var(--surface-2);color:var(--text)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)}
.nav-i span{flex:1}
.nav-badge{font-style:normal;font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me div{min-width:0}
.me b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;color:var(--text-3);font-size:12px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.main{min-width:0;padding-block:22px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .brand small{display:none}
  .side-foot{order:2;margin:0 0 0 auto;border:0;padding:0;flex-direction:row;align-items:center}
  .me div,.sync span{display:none}
  .nav{order:3;flex-direction:row;width:100%;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-i{width:auto;white-space:nowrap;padding:7px 10px}
  .main{padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- page header & controls ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.ph h1{margin:0;font-size:24px;line-height:1.15;letter-spacing:-.02em;font-weight:650;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--text-3)}
.ph-act{display:flex;flex-wrap:wrap;gap:8px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-hi);background:var(--surface);color:var(--text);font-weight:550;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icon{width:32px;height:32px;padding:0}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.wa{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.search{position:relative;display:flex;align-items:center;flex:1 1 260px;min-width:0;max-width:420px}
.search .ic{position:absolute;left:11px;color:var(--text-3)}
.search input{width:100%;height:36px;padding:0 34px 0 34px;border:1px solid var(--line-hi);border-radius:var(--r-sm);background:var(--surface)}
.search kbd{position:absolute;right:9px;font-family:var(--f-mono);font-size:10.5px;color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.search input:focus + kbd{display:none}
select,.inp{height:36px;border:1px solid var(--line-hi);border-radius:var(--r-sm);background-color:var(--surface);padding:0 10px;min-width:0}
select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.toolbar select{max-width:210px}
textarea.inp{height:auto;padding:9px 10px;resize:vertical;line-height:1.5;width:100%}
.inp{width:100%}
input[type="date"].inp{padding-right:6px}
.inp:focus,select:focus,.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.hint{font-size:12px;color:var(--text-3);margin:6px 0 0}
.seg{display:inline-flex;border:1px solid var(--line-hi);border-radius:var(--r-sm);padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;cursor:pointer;color:var(--text-2);font-weight:550;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

/* ---------- chips & avatars ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c,var(--text-2));background:color-mix(in srgb,var(--c,var(--text-3)) 13%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
[data-st="nuevo"]{--c:var(--st-nuevo)} [data-st="contactado"]{--c:var(--st-contactado)} [data-st="respondio"]{--c:var(--st-respondio)}
[data-st="interesado"]{--c:var(--st-interesado)} [data-st="propuesta"]{--c:var(--st-propuesta)} [data-st="ganado"]{--c:var(--st-ganado)}
[data-st="perdido"]{--c:var(--st-perdido)} [data-st="descartado"]{--c:var(--st-descartado)}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;flex:none;overflow:hidden;font-size:10.5px;font-weight:700;color:#fff;background:var(--text-3)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:32px;height:32px;font-size:12px}
.av.none{background:none;border:1.5px dashed var(--line-hi)}
.who{display:inline-flex;align-items:center;gap:7px;min-width:0;max-width:100%}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3)}
.ch.wa{color:var(--ok)}
.date{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:550;white-space:nowrap}
.date.late{color:var(--bad)} .date.today{color:var(--warn)}
.prio{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.prio.alta{background:var(--bad)} .prio.media{background:var(--warn)} .prio.baja{background:var(--line-hi)}

/* ---------- banner, empty, loading ---------- */
#banner:empty{display:none}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:var(--r);margin-bottom:16px;background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner .ic{color:var(--warn);margin-top:1px}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.bad .ic{color:var(--bad)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 20px;border:1px dashed var(--line-hi);border-radius:var(--r);background:var(--surface)}
.empty h3{margin:0;font-size:17px}
.empty p{margin:0;color:var(--text-3);max-width:46ch}
.empty .ph-act{justify-content:center;margin-top:6px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--text-3);margin-top:3px}
.kpi.alert .v{color:var(--bad)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alert-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.alert-row .ic{color:var(--warn)}
.alert-row.bad .ic{color:var(--bad)}
.alert-row p{margin:0;flex:1;min-width:200px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-h h2{margin:0;font-size:15px;font-weight:650}
.panel-h span{font-size:12px;color:var(--text-3)}
.funnel{display:flex;flex-direction:column;gap:7px}
.fr{display:grid;grid-template-columns:130px minmax(0,1fr) 92px;align-items:center;gap:10px;font-size:13px;cursor:pointer;border-radius:6px}
.fr:hover .fr-l{color:var(--accent)}
.fr-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--c,var(--accent));min-width:2px}
.fr-n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr-n small{color:var(--text-3);margin-left:4px}
.chart{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.chart-y{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--text-3);font-family:var(--f-mono);text-align:right;height:140px}
.chart-plot{position:relative;height:140px;border-bottom:1px solid var(--line-hi);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:end;gap:4px}
.chart-plot .cb{background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:3px 3px 0 0;min-height:0;position:relative}
.chart-plot .cb.today{background:var(--accent)}
.chart-plot .cb:hover{background:var(--accent-hi)}
.chart-x{grid-column:2;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;font-size:10.5px;color:var(--text-3);font-family:var(--f-mono);text-align:center}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:11.5px;color:var(--text-3);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
.rate{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.rate .bar{width:60px;height:6px}
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.fi:last-child{border-bottom:0}
.fi p{margin:0;font-size:13px;color:var(--text-2)}
.fi p b{color:var(--text);font-weight:600}
.fi time{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.linkish:hover{text-decoration:underline}

/* ---------- contacts table ---------- */
.list-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.bulk b{margin-right:4px}
.bulk select{height:30px;font-size:13px;background-color:var(--surface)}
table.lt{width:100%;min-width:1040px;border-collapse:collapse;font-size:13px}
table.lt th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;color:var(--text-3);padding:0 10px;height:36px;border-bottom:1px solid var(--line);white-space:nowrap}
table.lt th button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
table.lt th button:hover{color:var(--text)}
table.lt th .arr{font-family:var(--f-mono);font-size:10px;color:var(--accent)}
table.lt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lt tbody tr{cursor:pointer}
table.lt tbody tr:hover td{background:var(--surface-2)}
table.lt tbody tr.sel td{background:var(--accent-soft)}
table.lt tbody tr:last-child td{border-bottom:0}
.c-chk{width:36px}
.c-chk input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.nm{font-weight:600;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.st-sel{height:28px;font-size:12px;font-weight:600;border-radius:99px;border:1px solid transparent;color:var(--c);background-color:color-mix(in srgb,var(--c) 13%,transparent);padding:0 26px 0 10px;background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
.st-sel:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.st-sel option{color:var(--text);background:var(--surface)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--text-3)}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager .pg button{min-width:32px}
.pager .pg button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.count{font-variant-numeric:tabular-nums}

  if(c==="quota_exceeded")return toast("La base de datos llegó a su límite de espacio. Elimina contactos descartados para liberar espacio.","bad");
  if(c==="revoked")return toast("Tu acceso a este CRM cambió. Recarga la página.","bad");
  if(c==="resource_exhausted")return toast("Demasiados cambios seguidos. Espera unos segundos y vuelve a intentar.","bad");
  toast("No se pudo guardar el cambio. Revisa tu conexión e inténtalo otra vez.","bad");
}

}

const CAT_W=[[/dent|odont/,30],[/estetic|spa|salon|belleza|barber/,30],[/clinic|medic|psicolog/,28],[/veterin/,27],[/hotel|hostal/,26],[/inmobil/,25],[/restaur|cevich/,24],[/abogad|jurid/,22],[/contad|contable/,20],[/constru/,20],[/cafeter|cafe|coffee/,18],[/viaje|tour/,18],[/tienda|bodega|minimarket|grocery|abarrot/,4]];

const scoreCache=new Map();
function leadScore(l){
  const key=[l.name,l.category,l.city,l.phone,l.notes].join("|");const hit=scoreCache.get(l.id);if(hit&&hit.key===key)return hit.v;
  let s=0;const why=[];const ch=channel(l);const n=norm(l.name).trim();const c=norm(l.category);const city=norm(l.city);
  if(ch==="wa"){s+=30;why.push("Tiene WhatsApp")}else if(ch==="fijo"){s+=10;why.push("Solo teléfono fijo")}else why.push("Sin teléfono");
  let cw=12;for(const [re,w] of CAT_W)if(re.test(c)){cw=w;break}
  s+=cw;if(cw>=24)why.push("Rubro que gana clientes con una web");else if(cw<=5)why.push("Negocio pequeño");
  if(/clinica|centro|estudio|consultorio|spa|hotel|inmobiliaria|constructora|\bs\.?\s?a\.?\s?c\b|asociados|group|grupo|corp|medical|integral|especialidad/.test(n)){s+=12;why.push("Negocio establecido")}
  if(GENERIC_NAME.test(n)||(n.split(/\s+/).length<2&&n.length<9)){s-=10;why.push("Nombre muy genérico")}
  if(/lima/.test(city)){s+=10;why.push("Lima: el mercado más grande")}else if(/arequipa|trujillo/.test(city)){s+=8;why.push(`${l.city}: mercado grande`)}else if(city)s+=4;

    if(useStage&&F.stage){if(F.stage==="_open"){if(!OPEN.includes(l.stage))return false}else if(l.stage!==F.stage)return false}
    if(F.city&&l.city!==F.city)return false;if(F.cat&&l.category!==F.cat)return false;

const SORTS={score:l=>-leadScore(l).score,seq:l=>l.seq??1e9,name:l=>norm(l.name),city:l=>norm(l.city),stage:l=>ST[l.stage]?ST[l.stage].i:99,owner:l=>l.owner?norm(nameOf(l.owner)):"~",nextDate:l=>l.nextDate||"9999-99-99",lastContactAt:l=>l.lastContactAt||"",updatedAt:l=>l.updatedAt||""};

const Q_DAILY=25;
function qrQueue(){const me=S.me.id;return [...S.leads.values()]
  .filter(l=>l.stage==="nuevo"&&channel(l)==="wa"&&!l.lastContactAt&&(!l.owner||l.owner===me)&&!liveOn(l.id).length&&!S.qSkip.has(l.id)&&(!S.qCity||l.city===S.qCity)&&(!S.qCat||l.category===S.qCat))
  .map(l=>({l,sc:leadScore(l)})).sort((a,b)=>b.sc.score-a.sc.score||(a.l.seq??0)-(b.l.seq??0))}
function sentToday(){const t=todayStr();return S.acts.filter(a=>a.by&&a.by===S.me.id&&a.type==="whatsapp"&&todayStr(new Date(a.at))===t).length}
function qrTplId(){return S.templates.some(t=>t.id===S.qTpl)?S.qTpl:(S.templates[0]&&S.templates[0].id)}
function qrHref(){const l=S.leads.get(S.qCur),ta=$("#qr-text"),a=$("#qr-open");if(!l||!ta||!a)return;a.href=`https://wa.me/${normDigits(l.phone)}`+(ta.value.trim()?`?text=${encodeURIComponent(ta.value)}`:"")}
function qrFill(){const l=S.leads.get(S.qCur),ta=$("#qr-text");if(!l||!ta)return;const tp=S.templates.find(t=>t.id===qrTplId());ta.value=tp?fillTpl(tp.body,l):"";ta.oninput=qrHref;qrHref();
  $$(".qr-tpls .tpl-opt").forEach(b=>b.classList.toggle("on",b.dataset.id===qrTplId()))}
function qrNext(){S.qCur=null;renderView();window.scrollTo(0,0)}

      <div class="qr-discard" id="qr-discard" hidden><span>¿Por qué no aplica?</span>${["Ya tiene página web","Número equivocado","Negocio cerrado","No es un negocio"].map(r=>`<button class="btn sm" data-act="qr-discard-ok" data-reason="${esc(r)}">${esc(r)}</button>`).join("")}<button class="btn sm ghost" data-act="qr-discard-no">Cancelar</button></div>
      <p class="hint" style="margin:0">Al marcarlo como enviado, el negocio pasa a Contactado, queda a tu nombre y se agenda un seguimiento en 3 días. El resto del equipo ya no lo verá en su cola.</p>
    </section><aside class="qr-side" id="qr-side">${side}</aside></div>`;
    qrFill();
  }
};
async function qrAction(act,el){
  const id=S.qCur;const l=id&&S.leads.get(id);
  if(act==="qr-pick"){S.qCur=el.dataset.id;renderView();window.scrollTo(0,0);return}
  if(act==="qr-reset"){S.qSkip.clear();renderView();return}
  if(act==="qr-tpl"){S.qTpl=el.dataset.id;store.set("crm.qtpl",S.qTpl);qrFill();return}
  if(act==="qr-open"){qrHref();return}
  if(!l)return;
  if(act==="qr-skip"){S.qSkip.add(id);qrNext();return}
  if(act==="qr-discard"){const box=$("#qr-discard");if(box)box.hidden=!box.hidden;return}
  if(act==="qr-discard-no"){const box=$("#qr-discard");if(box)box.hidden=true;return}
  if(act==="qr-discard-ok"){el.disabled=true;const reason=el.dataset.reason;const ok=await saveLead(id,{stage:"descartado",stageAt:nowISO(),lostReason:reason},{type:"estado",from:l.stage,to:"descartado",text:reason});if(ok){toast(`${shortName(l.name)}: descartado (${reason})`);qrNext()}else el.disabled=false;return}
  if(act==="qr-sent"){el.disabled=true;const tp=S.templates.find(t=>t.id===qrTplId());
    const ok=await logActivity(id,"whatsapp",`Mensaje enviado${tp?`: ${tp.name}`:""} (contacto rápido)`,{nextDate:addDays(todayStr(),3),nextAction:l.nextAction||"Hacer seguimiento por WhatsApp"});
    if(ok){toast(`${shortName(l.name)} registrado · siguiente`,"ok");qrNext()}else el.disabled=false;return}
}

/* How each type of business is called in plural ({tipo}), what it calls its customers ({cliente}) and who decides ({encargado}). */
const RUBRO_WORDS=[
  [/dent|odont/,"consultorios dentales","paciente","el doctor o la persona encargada"],
  [/clinic|medic|psicolog/,"clínicas y centros médicos","paciente","el doctor o la persona encargada"],
  [/veterin/,"veterinarias","cliente","el veterinario o la persona encargada"],
  [/estetic|spa|salon|belleza|barber/,"salones y centros estéticos","clienta","la dueña o la persona encargada"],

  [/cafeter|cafe|coffee/,"cafeterías","cliente","el dueño o la persona encargada"],
  [/hotel|hostal/,"hoteles","huésped","el gerente o la persona encargada"],
  [/viaje|tour/,"agencias de viajes","cliente","el dueño o la persona encargada"],
  [/abogad|jurid/,"estudios de abogados","cliente","el abogado a cargo o la persona encargada"],

function rubroWords(l){const c=norm(l.category);for(const r of RUBRO_WORDS)if(r[0].test(c))return {tipo:r[1],cliente:r[2],encargado:r[3]};return {tipo:"negocios como el suyo",cliente:"cliente",encargado:"el dueño o la persona encargada"}}

let xlsxP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();if(xlsxP)return xlsxP;xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>window.XLSX?res():rej(new Error("x"));s.onerror=()=>{xlsxP=null;s.remove();rej(new Error("x"))};document.head.appendChild(s)});return xlsxP}
function mapStage(v){const s=norm(v).trim();if(!s)return "nuevo";if(s.includes("no interes")||s.includes("perdid"))return "perdido";if(s.includes("descart"))return "descartado";if(s.includes("cliente")||s.includes("ganad"))return "ganado";if(s.includes("propuesta"))return "propuesta";if(s.includes("interes"))return "interesado";if(s.includes("respond"))return "respondio";if(s.includes("enviado")||s.includes("contactado"))return "contactado";return "nuevo"}
function parseCSV(text){
  const first=text.split(/\r?\n/,1)[0]||"";const cnt=ch=>first.split(ch).length;const sep=[",",";","\t"].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(v=>String(v).trim()!==""));
}
async function parseWorkbook(file){
  await loadXLSX();const buf=await file.arrayBuffer();let wb;
  if(/\.(csv|txt)$/i.test(file.name||"")){let text;try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){text=new TextDecoder("windows-1252").decode(buf)}
    const ws=XLSX.utils.aoa_to_sheet(parseCSV(text.replace(/^﻿/,"")));wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"CSV")}
  else wb=XLSX.read(buf,{type:"array"});
  const rows=[];const sheets=[];
  for(const sn of wb.SheetNames){const ws=wb.Sheets[sn];if(!ws||!ws["!ref"])continue;const R=XLSX.utils.decode_range(ws["!ref"]);
    const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];const val=(r,c)=>{const x=cell(r,c);return x?String(x.w??x.v??"").trim():""};
    const detect=row=>{const cols={phones:[]};
      for(let c=R.s.c;c<=R.e.c;c++){const h=norm(val(row,c)).trim();if(!h||h.length>40)continue;
        if(cols.cat==null&&/tipo|rubro|categoria|giro|sector/.test(h))cols.cat=c;
        else if(cols.name==null&&/nombre|negocio|empresa|razon social/.test(h))cols.name=c;
        else if(cols.city==null&&/ciudad|distrito|provincia|localidad/.test(h))cols.city=c;
        else if(/celular|telefono|movil|whatsapp|fono|numero|phone/.test(h))cols.phones.push(c);
        else if(cols.maps==null&&/maps|mapa|ubicacion|link|url/.test(h))cols.maps=c;
        else if(cols.notes==null&&/nota|comentario|observacion/.test(h))cols.notes=c;
        else if(cols.stage==null&&/estado|etapa/.test(h))cols.stage=c;
        else if(cols.email==null&&/correo|email|e-mail/.test(h))cols.email=c}
      return cols.name!=null&&(cols.city!=null||cols.cat!=null||cols.phones.length||cols.maps!=null)?cols:null};
    let hr=-1,cols=null;for(let r=R.s.r;r<=Math.min(R.e.r,R.s.r+15);r++){const c=detect(r);if(c){hr=r;cols=c;break}}
    if(!cols)continue;let n=0;
    for(let r=hr+1;r<=R.e.r;r++){const name=val(r,cols.name);if(!name)continue;
      let phone="";for(const c of cols.phones){const v=val(r,c);if(digits(v).length>=6){phone=v;break}}
      let maps="";if(cols.maps!=null){const x=cell(r,cols.maps);maps=(x&&x.l&&x.l.Target)||val(r,cols.maps);maps=safeUrl(maps)}
      rows.push({name,city:cols.city!=null?val(r,cols.city):"",category:cols.cat!=null?val(r,cols.cat):"",phone,mapsUrl:maps,notes:cols.notes!=null?val(r,cols.notes):"",email:cols.email!=null?val(r,cols.email):"",stage:cols.stage!=null?mapStage(val(r,cols.stage)):"nuevo",sheet:sn});n++}
    if(n)sheets.push([sn,n])}
  return {rows,sheets};
}

async function runBulk(ids,fn,label){
  if(!guardWrite())return;const total=ids.length;if(!total)return;
  const el=document.createElement("div");el.className="toast";el.innerHTML=`<span></span>`;$("#toasts").appendChild(el);const sp=el.querySelector("span");sp.textContent=`${label}: 0 de ${total}`;
  let ok=0;const errs=await pool(ids,3,async(id,k)=>{const r=await fn(id,k);if(r)ok++},n=>{sp.textContent=`${label}: ${n} de ${total}`});
  el.remove();if(errs.length)handleWriteError(errs[0]);toast(`${label}: ${ok} de ${total} listos`,ok===total?"ok":"bad");
}

/* ================= events ================= */
document.addEventListener("click",async e=>{
  const t=e.target;
  const goB=t.closest("[data-go]");if(goB){go(goB.dataset.go);return}
  const actEl=t.closest("[data-act]");const act=actEl&&actEl.dataset.act;
  if(act&&act.startsWith("qr-")&&act!=="qr-city"&&act!=="qr-cat"){qrAction(act,actEl);return}
  if(act==="close-dw"){closeLead();return}
  if(t.closest("#scrim")){closeLead();return}
  if(act==="import"){openImport();return}
  if(act==="new-lead"){openNewLead();return}
  if(act==="export"){exportLeads(sortLeads(filterLeads(true)));return}
  if(act==="clear-f"){clearFilters();return}
  if(act==="wa"){e.stopPropagation();openWA(actEl.dataset.id);return}
  if(act==="copy-phone"){e.stopPropagation();const l=S.leads.get(actEl.dataset.id);if(l)copyText(l.phone,"Número copiado");return}
  if(act==="tpl-new"){openTplEditor(null);return}
  if(act==="tpl-edit"){openTplEditor(actEl.dataset.id);return}
  if(act==="tpl-copy"){const tp=S.templates.find(x=>x.id===actEl.dataset.id);if(tp)copyText(tp.body,"Plantilla copiada");return}
  if(act==="tpl-del"){const tp=S.templates.find(x=>x.id===actEl.dataset.id);if(!tp||!guardWrite())return;if(await confirmBox("Eliminar plantilla",`Se eliminará “${tp.name}” para todo el equipo.`,"Eliminar"))try{await withRetry(()=>S.db.doc("templates/"+tp.id).delete());toast("Plantilla eliminada")}catch(err){handleWriteError(err)}return}
  if(act==="go-unassigned"){Object.assign(F,{q:"",stage:"nuevo",city:"",cat:"",channel:"wa",owner:"_none",page:1});saveF();go("contactos");return}
  if(act==="sel"){e.stopPropagation();const id=actEl.dataset.id;actEl.checked?S.sel.add(id):S.sel.delete(id);renderView();return}
  if(act==="sel-page"){e.stopPropagation();const list=sortLeads(filterLeads(true));const rows=list.slice((F.page-1)*PAGE,F.page*PAGE);if(actEl.checked)rows.forEach(l=>S.sel.add(l.id));else rows.forEach(l=>S.sel.delete(l.id));renderView();return}
  if(act==="sel-none"){S.sel.clear();renderView();return}
  if(act==="sel-all"){filterLeads(true).forEach(l=>S.sel.add(l.id));renderView();return}
  if(act==="bulk-export"){exportLeads(sortLeads([...S.sel].map(id=>S.leads.get(id)).filter(Boolean)));return}
  if(act==="bulk-delete"){const ids=[...S.sel];if(!guardWrite())return;if(await confirmBox("Eliminar contactos",`Se eliminarán ${ids.length} contactos para todo el equipo. Esta acción no se puede deshacer.`,`Eliminar ${ids.length}`)){await runBulk(ids,async id=>{const l=S.leads.get(id);await withRetry(()=>S.db.doc("leads/"+id).delete());if(l)addActivity({type:"eliminado",leadName:l.name}).catch(()=>{});return true},"Eliminando");S.sel.clear();renderView()}return}
  if(act==="snooze"){e.stopPropagation();const days=Number(actEl.dataset.days);const id=actEl.dataset.id;const l=S.leads.get(id);if(!l)return;const nd=addDays(todayStr(),days);if(await saveLead(id,{nextDate:nd,nextAction:l.nextAction||"Hacer seguimiento"}))toast(`Seguimiento: ${fmtDay(nd)}`);return}
  if(act==="fu-done"){e.stopPropagation();const id=actEl.dataset.id;const l=S.leads.get(id);if(!l)return;if(await logActivity(id,"nota",`Seguimiento hecho: ${l.nextAction||"sin detalle"}`,{nextDate:"",nextAction:""})){toast("Seguimiento completado. Define el siguiente paso en la ficha.","ok");openLead(id)}return}
  // drawer actions
  if(S.openId&&t.closest("#drawer")){
    const id=S.openId;
    const step=t.closest("[data-step]");if(step){changeStage(id,step.dataset.step,true);return}
    const ty=t.closest("[data-type]");if(ty){S.dwType=ty.dataset.type;renderDrawerDyn();$("#dw-log").focus();return}
    const qn=t.closest("[data-qn]");if(qn){const ta=$("#dw-log");ta.value=ta.value.trim()?ta.value.trim()+". "+qn.dataset.qn:qn.dataset.qn;ta.focus();return}
    if(act==="take"){setOwner(id,S.me.id);return}
    if(act==="dw-next"){const d=actEl.dataset.days;const nd=d?addDays(todayStr(),Number(d)):"";const el=$("#dw-nextDate");if(el)el.value=nd;clearTimeout(S.dwTimers.nextDate);await commitField("nextDate");return}
    if(act==="log"){const ta=$("#dw-log");const text=ta.value.trim();if(!text&&S.dwType==="nota"){toast("Escribe la nota antes de registrar.","bad");ta.focus();return}actEl.disabled=true;const ok=await logActivity(id,S.dwType,text);actEl.disabled=false;if(ok){ta.value="";toast(`${ACT[S.dwType].l} registrado`,"ok")}return}
    if(act==="del-lead"){if(!guardWrite())return;const foot=$("#dw-foot");foot.innerHTML=`<div class="confirm-inline" style="width:100%"><span style="flex:1;min-width:180px">¿Eliminar este contacto y su ficha para todo el equipo?</span><button class="btn sm" data-act="del-cancel">Cancelar</button><button class="btn sm danger solid" data-act="del-ok">Eliminar</button></div>`;return}
    if(act==="del-cancel"){$("#dw-foot").innerHTML="";renderDrawerDyn();return}
    if(act==="del-ok"){const l=S.leads.get(id);actEl.disabled=true;try{await withRetry(()=>S.db.doc("leads/"+id).delete());if(l)addActivity({type:"eliminado",leadName:l.name}).catch(()=>{});S.dwTimers={};S.dwDirty.clear();closeLeadSubs();S.openId=null;$("#drawer").hidden=true;$("#scrim").hidden=true;document.body.classList.remove("dw-open");setPresence();toast("Contacto eliminado")}catch(err){actEl.disabled=false;handleWriteError(err)}return}
    return;
  }
  // view-level
  if(t.closest("#vbody")){
    const sortB=t.closest("[data-sort]");if(sortB){const k=sortB.dataset.sort;if(F.sort===k)F.dir=-F.dir;else{F.sort=k;F.dir=(k==="lastContactAt"||k==="updatedAt")?-1:1}F.page=1;saveF();renderView();return}
    const pg=t.closest("[data-page]");if(pg){F.page=Number(pg.dataset.page);saveF();renderView();$("#view").scrollIntoView({block:"start"});return}
    const fn=t.closest("[data-funnel]");if(fn){Object.assign(F,{q:"",stage:fn.dataset.funnel,city:"",cat:"",channel:"",owner:S.dashScope==="me"&&S.me.id?"_me":"",page:1});saveF();go("contactos");return}
    const bk=t.closest("[data-brk]");if(bk){Object.assign(F,{q:"",stage:"",city:"",cat:"",channel:"",owner:S.dashScope==="me"&&S.me.id?"_me":"",page:1});F[bk.dataset.brk==="city"?"city":"cat"]=bk.dataset.val;saveF();go("contactos");return}
    const cm=t.closest("[data-colmore]");if(cm){F.stage=cm.dataset.colmore;F.page=1;saveF();go("contactos");return}
    const ob=t.closest("button[data-open]");if(ob){openLead(ob.dataset.open);return}
    if(t.closest("select,input,a,button,label"))return;
    const op=t.closest("[data-open]");if(op){openLead(op.dataset.open);return}
  }
  const op=t.closest("[data-open]");if(op&&!t.closest("#drawer")){openLead(op.dataset.open)}
});
document.addEventListener("change",async e=>{
  const t=e.target;const act=t.dataset&&t.dataset.act;
  if(act==="qr-city"||act==="qr-cat"){S[act==="qr-city"?"qCity":"qCat"]=t.value;S.qCur=null;t.blur();renderView();return}
  if(act==="row-stage"){const id=t.dataset.id;const to=t.value;t.dataset.st=to;t.blur();const ok=await changeStage(id,to);if(!ok){const l=S.leads.get(id);if(l){t.value=l.stage;t.dataset.st=l.stage}}return}
  if(act==="bulk-owner"&&t.value){const v=t.value;t.value="";const ids=[...S.sel];if(v==="_split"){const team=teamIds();await runBulk(ids,(id,k)=>setOwner(id,team[k%team.length],true),"Repartiendo")}else await runBulk(ids,id=>setOwner(id,v==="_none"?null:v,true),"Asignando");S.sel.clear();renderView();return}
  if(act==="bulk-stage"&&t.value){const v=t.value;t.value="";const ids=[...S.sel];await runBulk(ids,id=>{const l=S.leads.get(id);return l&&l.stage===v?true:changeStage(id,v,true)},"Cambiando etapa");S.sel.clear();renderView();return}
  if(t.closest("#drawer")){
    if(t.id==="dw-owner"){const v=t.value;t.blur();const ok=await setOwner(S.openId,v||null);if(!ok)updateDrawer();return}
    if(t.dataset.f){clearTimeout(S.dwTimers[t.dataset.f]);commitField(t.dataset.f)}
  }
});
document.addEventListener("input",e=>{const t=e.target;if(t.closest&&t.closest("#drawer")&&t.dataset.f&&t.tagName!=="SELECT"&&t.type!=="date"){const f=t.dataset.f;S.dwDirty.add(f);clearTimeout(S.dwTimers[f]);S.dwTimers[f]=setTimeout(()=>commitField(f),900)}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(modalStack.length){closeModal();e.preventDefault();return}if(S.openId){closeLead();e.preventDefault();return}}
  if(e.key==="/"&&!e.ctrlKey&&!e.metaKey){const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"||a.isContentEditable))return;if(modalStack.length||S.openId)return;const q=$("#f-q");if(q){e.preventDefault();q.focus();q.select()}}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-funnel]")){e.preventDefault();e.target.click()}
});
// drag & drop on pipeline
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-drag]");if(!c||S.readOnly)return;e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move";c.classList.add("dragging")});
document.addEventListener("dragend",e=>{const c=e.target.closest&&e.target.closest("[data-drag]");if(c)c.classList.remove("dragging");$$(".col.over").forEach(x=>x.classList.remove("over"))});
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
document.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
document.addEventListener("drop",e=>{if(hasFiles(e))e.preventDefault()});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest("[data-col]");if(!col)return;e.preventDefault();e.dataTransfer.dropEffect="move";$$(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=e.target.closest&&e.target.closest("[data-col]");if(!col)return;e.preventDefault();col.classList.remove("over");const id=e.dataTransfer.getData("text/plain");if(id&&S.leads.has(id))changeStage(id,col.dataset.col)});
setInterval(()=>{if(S.leadsReady&&(S.view==="resumen"||S.view==="seguimientos"))scheduleRender();renderBadges()},60000);

/* ================= boot ================= */
async function boot(){
  renderShell();go((location.hash||"").replace("#","")||"resumen");
  const C=window.claude;
  if(!C||typeof C.use!=="function"){S.phase="noclaude";renderBanner();renderSync();renderView();return}
  const slow=setTimeout(()=>{if(!S.leadsReady){S.connSlow=true;renderBanner();renderSync()}},10000);
  const safe=p=>Promise.resolve(p).catch(()=>null);
  const [db,user,dl,room]=await Promise.all([safe(C.use("db")),safe(C.use("user")),safe(C.use("downloads")),safe(C.use("room"))]);
  S.user=user;S.dl=dl;
  if(user){try{const me=await user.me();S.me={id:me.id,name:me.name||"",avatarUrl:me.avatarUrl,color:me.color,isOwner:!!me.isOwner,canEdit:!!me.canEdit};if(me.id)S.profiles[me.id]={id:me.id,name:me.name,avatarUrl:me.avatarUrl,color:me.color}}catch(e){}
    try{S.canWrite=await user.can("data.write")}catch(e){S.canWrite=null}}
  if(!db){clearTimeout(slow);S.phase="nodb";renderBanner();renderSync();renderView();renderMe();return}
  S.db=db;S.phase="ready";
  if(S.canWrite===false)setReadOnly(true);
  renderMe();
  const onErr=what=>e=>{if(e&&e.code==="revoked"){toast("Tu acceso a este CRM cambió. Recarga la página.","bad");return}toast(`Se perdió la conexión con ${what}. Recarga la página para reconectar.`,"bad")};
  db.collection("leads").limit(LEAD_CAP).onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(d=>{const x=d.data();if(x)m.set(d.id,{...x,id:d.id})});
    S.leads=m;S.leadsCapped=snap.size>=LEAD_CAP;S.sync=snap.metadata.fromCache?"cache":"ok";S.pending=snap.metadata.hasPendingWrites;
    if(!snap.metadata.fromCache){clearTimeout(slow);S.connSlow=false}
    const first=!S.leadsReady;S.leadsReady=true;if(first||!snap.metadata.fromCache)renderBanner();
    ensureProfiles();scheduleRender();
  },e=>{clearTimeout(slow);onErr("los contactos")(e);S.leadsReady=true;scheduleRender()});
  db.collection("activities").orderBy("at","desc").limit(1000).onSnapshot(snap=>{S.acts=snap.docs.map(d=>({...d.data(),id:d.id}));if(!snap.metadata.fromCache||S.seenActs!==null)notifyActs(S.acts);ensureProfiles();scheduleRender()},onErr("el historial"));
  if(room){S.room=room;try{room.onPeers(ch=>onPeers(ch.peers),()=>{S.live=new Map();S.online=[];renderOnline();scheduleRender()});setPresence()}catch(e){S.room=null}}
  db.collection("members").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));S.members=m;ensureProfiles();scheduleRender()},()=>{});
  db.collection("templates").onSnapshot(snap=>{S.templates=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name),"es"));S.templatesReady=true;scheduleRender()},()=>{S.templatesReady=true;scheduleRender()});
  // register this person in the team list (at most every 6 hours)
  if(S.me.id&&!S.readOnly){try{const ref=db.doc("members/"+S.me.id);const s=await ref.get();const d=s.exists?s.data():null;if(!d||Date.now()-Date.parse(d.lastSeen||0)>6*3600e3)await ref.set({firstSeen:(d&&d.firstSeen)||nowISO(),lastSeen:nowISO()})}catch(e){if(e&&e.code==="invalid_argument"&&S.canWrite!==true)setReadOnly(true)}}
}
if(window.CRM_READY)window.CRM_READY.then(boot);else boot();
</script>
